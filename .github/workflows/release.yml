name: Android CI/CD

# Trigger the workflow on pushes to main, or when a version tag (v1.0.0) is pushed, or manually via the Actions tab.
on:
  push:
    branches: ["main", "master"]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract version info
        id: version_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            VERSION_NAME="${TAG_NAME#v}"
            echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
            echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
          else
            echo "VERSION_NAME=1.0" >> $GITHUB_ENV
            echo "VERSION_CODE=1" >> $GITHUB_ENV
          fi

      - name: Build APKs
        run: ./gradlew assembleRelease -PversionName=${{ env.VERSION_NAME }} -PversionCode=${{ env.VERSION_CODE }}

      - name: Sign APK
        uses: ilharp/sign-android-release@v1
        id: sign_app
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.SIGNING_KEY }}
          keyAlias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 34.0.0

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/release/app-release-unsigned-signed.apk app/build/outputs/apk/release/NoSleep.apk
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/NoSleep-unsigned.apk

      - name: Upload Signed APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoSleep-Signed-APK
          path: app/build/outputs/apk/release/NoSleep.apk

      - name: Upload Unsigned APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoSleep-Unsigned-APK
          path: app/build/outputs/apk/release/NoSleep-unsigned.apk

      # Automatically publish a GitHub Release when a tag (e.g., 'v1.0.0') is pushed
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            app/build/outputs/apk/release/NoSleep.apk
            app/build/outputs/apk/release/NoSleep-unsigned.apk
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
